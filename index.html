<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Daily Mood — Connexion</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1c1c2e;
  --ink-muted: #4a4a6a;
  --ink-faint: #9090b0;
  --paper: #f8f6f2;
  --paper-warm: #f2ede3;
  --paper-line: #e5dfd4;
  --gold: #b8851a;
  --gold-light: #fdf3d8;
  --green: #2a7a4f;
  --green-light: #e6f5ee;
  --red: #9b2e2e;
  --red-light: #fceaea;
  --accent: #5046c8;
  --accent-light: #eeedf8;
  --shadow: rgba(28,28,46,0.08);
  --shadow-md: rgba(28,28,46,0.14);
  --radius: 16px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink: #eae8f4;
    --ink-muted: #9898be;
    --ink-faint: #555570;
    --paper: #111118;
    --paper-warm: #17171f;
    --paper-line: #252530;
    --gold: #d4a840;
    --gold-light: #2a2010;
    --green: #4aaa70;
    --green-light: #0d251a;
    --red: #d06060;
    --red-light: #250d0d;
    --accent: #7b70f0;
    --accent-light: #1a1835;
    --shadow: rgba(0,0,0,0.4);
    --shadow-md: rgba(0,0,0,0.6);
  }
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
}

.auth-box {
  background: white;
  border: 1px solid var(--paper-line);
  border-radius: var(--radius);
  padding: 2.5rem 2rem;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 4px 32px var(--shadow-md);
  position: relative;
  z-index: 1;
}
@media (prefers-color-scheme: dark) { .auth-box { background: var(--paper-warm); } }

.auth-logo {
  text-align: center;
  margin-bottom: 2rem;
}
.auth-logo h1 {
  font-family: 'Lora', serif;
  font-size: 26px;
  font-weight: 400;
}
.auth-logo h1 em { font-style: italic; color: var(--gold); }
.auth-logo p { font-size: 13px; color: var(--ink-faint); margin-top: 6px; }

.auth-tabs {
  display: flex;
  gap: 3px;
  background: var(--paper-warm);
  border: 1px solid var(--paper-line);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 1.75rem;
}
.auth-tab {
  flex: 1;
  padding: 8px;
  border: none;
  background: transparent;
  border-radius: 8px;
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.auth-tab.active {
  background: white;
  color: var(--ink);
  font-weight: 600;
  box-shadow: 0 1px 4px var(--shadow);
}
@media (prefers-color-scheme: dark) { .auth-tab.active { background: var(--paper-line); } }

.auth-field { margin-bottom: 1rem; }
.auth-field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-faint); margin-bottom: 6px; letter-spacing: 0.05em; }
.auth-input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--paper-line);
  border-radius: 10px;
  background: var(--paper);
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.auth-input::placeholder { color: var(--ink-faint); }

.auth-btn {
  width: 100%;
  padding: 13px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  margin-top: 0.5rem;
}
.auth-btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
.auth-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.auth-link {
  display: block;
  text-align: center;
  margin-top: 0.85rem;
  font-size: 12px;
  color: var(--ink-faint);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
  transition: color 0.2s;
  background: none;
  border: none;
  font-family: 'Outfit', sans-serif;
  width: 100%;
}
.auth-link:hover { color: var(--accent); }

.auth-error {
  margin-top: 1rem;
  padding: 10px 13px;
  background: var(--red-light);
  border: 1px solid rgba(155,46,46,0.2);
  border-radius: 8px;
  font-size: 13px;
  color: var(--red);
  display: none;
}
.auth-error.visible { display: block; }

.auth-success {
  margin-top: 1rem;
  padding: 10px 13px;
  background: var(--green-light);
  border: 1px solid rgba(42,122,79,0.2);
  border-radius: 8px;
  font-size: 13px;
  color: var(--green);
  display: none;
}
.auth-success.visible { display: block; }
</style>
</head>
<body>

<div class="auth-box">
  <div class="auth-logo">
    <h1>Mon <em>Daily</em> mood</h1>
    <p>Ton journal de bien-être quotidien</p>
  </div>

  <!-- Tabs : Connexion / Créer un compte -->
  <div class="auth-tabs" id="authTabsRow">
    <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Connexion</button>
    <button class="auth-tab" id="tabSignup" onclick="switchAuthTab('signup')">Créer un compte</button>
  </div>

  <!-- CONNEXION -->
  <div id="authLoginForm">
    <div class="auth-field">
      <label>Adresse e-mail</label>
      <input class="auth-input" type="email" id="loginEmail" placeholder="toi@exemple.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Mot de passe</label>
      <input class="auth-input" type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="auth-btn" id="loginBtn" onclick="handleLogin()">Se connecter</button>
    <button class="auth-link" onclick="switchAuthTab('forgot')">Mot de passe oublié ?</button>
    <div class="auth-error" id="loginError"></div>
  </div>

  <!-- INSCRIPTION -->
  <div id="authSignupForm" style="display:none">
    <div class="auth-field">
      <label>Adresse e-mail</label>
      <input class="auth-input" type="email" id="signupEmail" placeholder="toi@exemple.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Mot de passe</label>
      <input class="auth-input" type="password" id="signupPassword" placeholder="8 caractères minimum" autocomplete="new-password">
    </div>
    <button class="auth-btn" id="signupBtn" onclick="handleSignup()">Créer mon compte</button>
    <div class="auth-error" id="signupError"></div>
    <div class="auth-success" id="signupSuccess">Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi.</div>
  </div>

  <!-- MOT DE PASSE OUBLIÉ -->
  <div id="authForgotForm" style="display:none">
    <p style="font-size:13px;color:var(--ink-muted);margin-bottom:1.25rem;line-height:1.6">
      Saisis ton adresse e-mail et on t'envoie un lien pour réinitialiser ton mot de passe.
    </p>
    <div class="auth-field">
      <label>Adresse e-mail</label>
      <input class="auth-input" type="email" id="forgotEmail" placeholder="toi@exemple.com" autocomplete="email">
    </div>
    <button class="auth-btn" id="forgotBtn" onclick="handleForgotPassword()">Envoyer le lien</button>
    <button class="auth-link" onclick="switchAuthTab('login')">← Retour à la connexion</button>
    <div class="auth-error" id="forgotError"></div>
    <div class="auth-success" id="forgotSuccess">Lien envoyé ! Vérifie ta boîte mail (et tes spams).</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://hjvlwzcvstniapdrzajq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhqdmx3emN2c3RuaWFwZHJ6YWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDkyNTIsImV4cCI6MjEwNDE4NTI1Mn0.c3xoY8aAeu8IdRy8iBIPspbkEkjMgWzGCiU2JJCFMao';

const TOKEN_KEY = 'dm_token';
const REFRESH_KEY = 'dm_refresh';

// L'URL de l'app pour les redirections Supabase pointe vers /app
// (reset mdp, confirmation email)
function getAppUrl() {
  return window.location.origin + '/app';
}

function saveSession(access_token, refresh_token) {
  try {
    localStorage.setItem(TOKEN_KEY, access_token);
    if (refresh_token) localStorage.setItem(REFRESH_KEY, refresh_token);
  } catch {}
}

async function supabaseAuth(endpoint, body) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/${endpoint}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
    body: JSON.stringify(body),
  });
  return r.json();
}

function switchAuthTab(tab) {
  const tabsRow = document.getElementById('authTabsRow');
  tabsRow.style.display = (tab === 'forgot') ? 'none' : '';
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
  document.getElementById('authLoginForm').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('authSignupForm').style.display = tab === 'signup' ? '' : 'none';
  document.getElementById('authForgotForm').style.display = tab === 'forgot' ? '' : 'none';
}

async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.classList.remove('visible');
  if (!email || !password) { errEl.textContent = 'Remplis tous les champs.'; errEl.classList.add('visible'); return; }
  btn.disabled = true; btn.textContent = 'Connexion…';
  const data = await supabaseAuth('token?grant_type=password', { email, password }).catch(() => null);
  btn.disabled = false; btn.textContent = 'Se connecter';
  if (!data || data.error || !data.access_token) {
    errEl.textContent = data?.error_description || data?.msg || 'Email ou mot de passe incorrect.';
    errEl.classList.add('visible');
    return;
  }
  saveSession(data.access_token, data.refresh_token);
  window.location.href = '/app';
}

async function handleSignup() {
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const errEl = document.getElementById('signupError');
  const successEl = document.getElementById('signupSuccess');
  const btn = document.getElementById('signupBtn');
  errEl.classList.remove('visible'); successEl.classList.remove('visible');
  if (!email || !password) { errEl.textContent = 'Remplis tous les champs.'; errEl.classList.add('visible'); return; }
  if (password.length < 8) { errEl.textContent = 'Le mot de passe doit faire 8 caractères minimum.'; errEl.classList.add('visible'); return; }
  btn.disabled = true; btn.textContent = 'Création…';
  const data = await supabaseAuth('signup', {
    email, password,
    options: { emailRedirectTo: getAppUrl() }
  }).catch(() => null);
  btn.disabled = false; btn.textContent = 'Créer mon compte';
  if (!data || data.error) {
    errEl.textContent = data?.msg || data?.error_description || 'Une erreur est survenue.';
    errEl.classList.add('visible');
    return;
  }
  // Compte créé sans confirmation email → connexion directe
  if (data.access_token) {
    saveSession(data.access_token, data.refresh_token);
    window.location.href = '/app';
    return;
  }
  // Confirmation email requise
  successEl.classList.add('visible');
}

async function handleForgotPassword() {
  const email = document.getElementById('forgotEmail').value.trim();
  const errEl = document.getElementById('forgotError');
  const successEl = document.getElementById('forgotSuccess');
  const btn = document.getElementById('forgotBtn');
  errEl.classList.remove('visible'); successEl.classList.remove('visible');
  if (!email) { errEl.textContent = 'Saisis ton adresse e-mail.'; errEl.classList.add('visible'); return; }
  btn.disabled = true; btn.textContent = 'Envoi…';
  try {
    await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ email, options: { redirectTo: getAppUrl() } }),
    });
    successEl.classList.add('visible');
  } catch {
    errEl.textContent = 'Une erreur est survenue. Réessaie.';
    errEl.classList.add('visible');
  }
  btn.disabled = false; btn.textContent = 'Envoyer le lien';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const loginForm = document.getElementById('authLoginForm');
    if (loginForm.style.display !== 'none' && document.activeElement?.closest('#authLoginForm')) handleLogin();
    const forgotForm = document.getElementById('authForgotForm');
    if (forgotForm.style.display !== 'none' && document.activeElement?.closest('#authForgotForm')) handleForgotPassword();
  }
});

// Si déjà connecté → rediriger vers l'app directement
(function() {
  try {
    const token = localStorage.getItem('dm_token');
    if (token) window.location.replace('/app');
  } catch {}
})();
</script>
</body>
</html>
